<!doctype html>
<!-- DEPRECATED / NOT LIVE (L3 triage 2026-06-29): a static demo of the original
     hermes-charts.js "CPR Spine" engine, which is no longer wired (see

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes charts — CPR Spine demo</title>
<style>
  html,body{margin:0;background:#010409;color:#c9d1d9;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:980px;margin:24px auto;padding:0 16px}
  h1{font-size:15px;font-weight:600;color:#e6edf3;margin:0 0 4px}
  .sub{font-size:12px;color:#8b949e;margin:0 0 16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Patearn chart engine — Phase 0 / 1 preview</h1>
  <p class="sub">One responsive chart · four-family control bar · the CPR Spine (amber ribbon, coils at compression, fuses at D·W·M confluence, marks the U reversal). Synthetic data.</p>
  <div id="chart"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="./hermes-charts.js"></script>
<script>
// --- seeded PRNG (reproducible) ---------------------------------------------
var seed = 20260624;
function rnd(){ seed = (seed*1664525 + 1013904223) & 0x7fffffff; return seed/0x7fffffff; }

// --- synthetic daily series: uptrend -> pullback -> coil -> breakout ---------
function genSeries(n){
  var out=[], px=100, d=new Date(Date.UTC(2025,0,2));
  for(var i=0;i<n;i++){
    // regime-driven drift
    var drift;
    if(i<60) drift=0.45;            // uptrend
    else if(i<110) drift=-0.34;     // pullback
    else if(i<176) drift=(120.5 - px)*0.04;  // coil: mean-revert to ~120 (narrow)
    else drift=0.62;                // breakout
    var vol = (i>=110&&i<176)? 0.45 : 1.15;   // compressed vol in the coil
    var open=px;
    px = Math.max(5, px + drift + (rnd()-0.5)*2*vol);
    var close=px;
    var hi=Math.max(open,close)+rnd()*vol*1.1, lo=Math.min(open,close)-rnd()*vol*1.1;
    // DVPT: baseline + institutional spikes near accumulation (105-112, 176-188)
    var hot = (i>=106&&i<=108) || (i>=178&&i<=180);
    var dvpt = (hot? 7.5+rnd()*4 : 1.2+rnd()*1.6) * 1e6 * (close/100);
    out.push({
      time: d.toISOString().slice(0,10),
      open:+open.toFixed(2), high:+hi.toFixed(2), low:+lo.toFixed(2), close:+close.toFixed(2),
      dvpt:Math.round(dvpt), r1m: hot?1.6:0.7,
      deliv:+(38+rnd()*30).toFixed(1), tval:Math.round(dvpt*(3+rnd()*2)), dval:Math.round(dvpt*(1.4+rnd()))
    });
    do { d.setUTCDate(d.getUTCDate()+1); } while(d.getUTCDay()===0||d.getUTCDay()===6);
  }
  return out;
}

// --- ISO week key ------------------------------------------------------------
function isoWeek(s){
  var dt=new Date(s+'T00:00:00Z'), day=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-day+3);
  var y=dt.getUTCFullYear(), j4=new Date(Date.UTC(y,0,4)), j=(j4.getUTCDay()+6)%7;
  j4.setUTCDate(j4.getUTCDate()-j+3);
  return y+'-W'+('0'+(1+Math.round((dt-j4)/(7*864e5)))).slice(-2);
}
function pkey(s,tf){ return tf==='M'? s.slice(0,7) : tf==='W'? isoWeek(s) : s; }

// --- CPR segments for a timeframe (band from the PRIOR period's H/L/C) -------
function cprFor(S, tf, coilPct){
  // group into consecutive periods
  var groups=[], cur=null;
  for(var i=0;i<S.length;i++){
    var k=pkey(S[i].time,tf);
    if(!cur||cur.k!==k){ cur={k:k, t0:S[i].time, hi:S[i].high, lo:S[i].low, close:S[i].close}; groups.push(cur); }
    else { cur.hi=Math.max(cur.hi,S[i].high); cur.lo=Math.min(cur.lo,S[i].low); cur.close=S[i].close; }
  }
  var segs=[];
  for(var g=1; g<groups.length; g++){
    var prev=groups[g-1], cer=groups[g];
    var P=(prev.hi+prev.lo+prev.close)/3, BC=(prev.hi+prev.lo)/2, TC=2*P-BC;
    var lo=Math.min(BC,TC), hi=Math.max(BC,TC);
    var width=(hi-lo)/P*100;
    segs.push({
      t0:cer.t0, t1:(groups[g+1]?groups[g+1].t0:cer.t0),
      p:+P.toFixed(2), bc:+lo.toFixed(2), tc:+hi.toFixed(2),
      width:+width.toFixed(2), coil: width<=coilPct,
      regime: cer.close>=P?1:-1, pattern:null, confirmed:false
    });
  }
  // U / inverted-U from clean directional steps over C2->C1->C0
  function up(a,b){ return b.tc>a.tc && b.bc>a.bc; }
  function dn(a,b){ return b.tc<a.tc && b.bc<a.bc; }
  for(var i=2;i<segs.length;i++){
    var c2=segs[i-2], c1=segs[i-1], c0=segs[i];
    if(dn(c2,c1)&&up(c1,c0)) c1.pattern='BULL_U';
    else if(up(c2,c1)&&dn(c1,c0)) c1.pattern='BEAR_INVU';
  }
  return segs;
}

var S = genSeries(260);
var cpr = { D:cprFor(S,'D',1.0), W:cprFor(S,'W',2.5), M:cprFor(S,'M',5.0) };

// confluence: latest W & M pivots clustering
var lw=cpr.W[cpr.W.length-1], lm=cpr.M[cpr.M.length-1], confluence=[];
if(lw&&lm&&Math.abs(lw.p-lm.p)/lw.p<0.02){
  var lo=Math.min(lw.bc,lm.bc), hi=Math.max(lw.tc,lm.tc);
  confluence.push({lo:lo, hi:hi, degrees:2});
}

HermesCharts.createStockChart(document.getElementById('chart'), {
  symbol:'DEMOCHART', name:'Synthetic Ltd', rank:'A',
  read:'Big money has been accumulating · price coiled in a narrow band near D·W·M support · a move may be pending.',
  series:S,
  zones:[{price:118, color:'#3fb950', label:'inst support'},{price:150, color:'#f85149', label:'inst resist'}],
  cpr:cpr, confluence:confluence
}, { height:460, cprTf:'W' });
</script>
</body>
</html>
