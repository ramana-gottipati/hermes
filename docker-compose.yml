services:
  hermes-api:
    build: .
    container_name: hermes-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HERMES_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  hermes-scheduler:
    build: .
    container_name: hermes-scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "src.automation.scheduler"]
    depends_on:
      - hermes-api

