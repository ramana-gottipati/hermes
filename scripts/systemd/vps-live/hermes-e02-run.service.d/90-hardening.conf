# AUD-31/35 hardening drop-in (house pattern). 1h ceiling: the reconciliation abort takes
# seconds; the full protocol (CAR + 2x200 placebo) fits well inside an hour.
[Service]
TimeoutStartSec=3600
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/opt/hermes /var/log
