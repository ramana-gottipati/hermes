# AUD-31/35 hardening drop-in (house pattern). journalctl/systemctl are read-only
# queries and work under ProtectSystem=strict; sections degrade gracefully if not.
[Service]
TimeoutStartSec=300
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/opt/hermes /var/log
