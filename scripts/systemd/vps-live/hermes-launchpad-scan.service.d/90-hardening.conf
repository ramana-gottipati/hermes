# AUD-31/35 hardening drop-in (fleet-standard, S77b pattern).
# TimeoutStartSec: a wedged oneshot must FAIL, not stay 'activating' forever.
# Sandbox: no-new-privs, private /tmp, read-only system except the hermes tree
# + logs. No User= change yet (DB files root-owned; that migration needs its
# own window).
[Service]
TimeoutStartSec=1800
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/opt/hermes /var/log
