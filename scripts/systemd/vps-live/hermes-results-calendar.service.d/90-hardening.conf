# AUD-31/35 hardening drop-in (in git: scripts/systemd/vps-live/). TimeoutStartSec so a
# wedged NSE fetch FAILS rather than staying 'activating' forever (oneshot has no default
# start timeout); sandbox = no-new-privs, private /tmp, read-only system except the hermes
# tree + logs. No User= change yet (DB files root-owned; that migration needs its own window).
[Service]
TimeoutStartSec=1800
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/opt/hermes /var/log
