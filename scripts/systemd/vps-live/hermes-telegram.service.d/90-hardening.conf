# AUD-31/35 hardening drop-in (S77b, in git: scripts/systemd/vps-live/).
# TimeoutStartSec: a wedged oneshot must FAIL, not stay 'activating' forever
# (oneshot has NO default start timeout; a hung NSE fetch silently kills every
# future fire). Sandbox: no-new-privs, private /tmp, read-only system except
# the hermes tree + logs. No User= change yet (DB files root-owned; that
# migration needs its own window).
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/opt/hermes /var/log
