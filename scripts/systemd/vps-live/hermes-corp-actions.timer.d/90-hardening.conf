# Persistent=false (set in the base .timer, deliberately UNLIKE the Persistent=true ingest
# timers): a trailing-45d-window fetch needs no boot catch-up — a missed night is healed by
# the next night's overlap — and this also makes ENABLING the timer mid-day safe: with no
# missed-elapse catch-up, `systemctl enable --now` arms it for the next 02:20 UTC and does
# NOT fire now (AUD-95 class). RandomizedDelaySec spreads the fire off the exact minute.
[Timer]
RandomizedDelaySec=600
