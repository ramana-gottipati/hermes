# Persistent=false (set in the base .timer, deliberately UNLIKE the Persistent=true ingest
# timers): a FORWARD calendar needs no boot catch-up — a missed night simply refreshes on the
# next fire — and this also makes ENABLING the timer mid-day safe: with no missed-elapse
# catch-up, `systemctl enable --now` arms it for the next 02:00 UTC and does NOT fire now
# (AUD-95 class). RandomizedDelaySec spreads the fire off the exact minute.
[Timer]
RandomizedDelaySec=600
