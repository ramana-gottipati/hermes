# AUD-31/35 hardening drop-in (in git: scripts/systemd/vps-live/). TimeoutStartSec so a wedged
# fetch/compute FAILS rather than staying 'activating' forever; sandbox = no-new-privs, private
# /tmp, read-only system except the hermes tree + logs. Snapshot build is ~1-2 min (6.9k events).
[Service]
TimeoutStartSec=1800
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/opt/hermes /var/log
