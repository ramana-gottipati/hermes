[Service]
# Signal-event bus detect (S101): the Tier-0 "one bus, four faces" spine
# (docs/product-strategy-2026.md §9) — pure-Python state-change detectors over
# the lens tables this very chain just wrote (10-signals: mep_signals;
# 20-rsdepth: rsband_signals; 30-fnooi: fno_oi_signals; deals 14:30 UTC and
# credibility 07:00 UTC land earlier via their own timers). Rule-based, no LLM,
# idempotent (INSERT OR IGNORE on the UNIQUE event key) — a re-run emits
# nothing new. Isolated drop-in, lexical order 10..60: runs LAST, so a failure
# here cannot break the upstream signal chain.
#
# S138: ARM the owner-DM pager (signal_alert_telegram). Its auto-push gate is
# `os.environ.get("HERMES_ALERT_DM")`; NO hermes service loads /opt/hermes/.env
# into the process environment (they use pydantic-settings for declared fields
# only), so the flag lives HERE — git-owned, targeted to exactly the --detect
# step. Remove this one line + re-install to DISARM the DM (the code stays put,
# just dormant again). Private OWNER DM only, never the public channel (S-F).
Environment=HERMES_ALERT_DM=1
ExecStart=/opt/hermes/.venv/bin/python -m src.automation.signal_events --detect
