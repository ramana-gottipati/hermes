[Service]
# RS-deepening (session 20): runs after the signal chain (10-signals.conf builds
# index_rows + ratio_rows). Separate drop-in so the contended 10-signals.conf is
# never touched; systemd merges drop-ins in lexical order (10 -> 20).
ExecStart=/opt/hermes/.venv/bin/python -m src.automation.rrg
ExecStart=/opt/hermes/.venv/bin/python -m src.automation.capture
# RS support/resistance band (2026-06-23): mean-reversion lens off ratio_rows (rsband_signals).
ExecStart=/opt/hermes/.venv/bin/python -m src.automation.rsband
