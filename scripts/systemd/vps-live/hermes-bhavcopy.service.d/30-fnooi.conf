[Service]
# F&O Open-Interest (session 35): the IDENTITY channel. Runs after the signal
# chain — needs the day's cash bhav (bhavcopy_rows) for the price change.
# Separate drop-in so the contended 10-signals.conf is never touched (systemd
# merges drop-ins in lexical order: 10 -> 20 -> 30).
ExecStart=/opt/hermes/.venv/bin/python -m src.automation.fno_oi
